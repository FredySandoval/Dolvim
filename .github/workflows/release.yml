name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            linker: gcc
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ARM linker
        if: matrix.arch == 'aarch64'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        run: tar -czf "dolvim-linux-${{ matrix.arch }}.tar.gz" -C "target/${{ matrix.target }}/release" dolvim -C ../../.. README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: dolvim-linux-${{ matrix.arch }}.tar.gz
          path: dolvim-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
