[package]
name = "dolvim"
version = "0.0.2"
edition = "2021"
description = "KDE Dolphin, recreated in the terminal"
license = "MIT"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
trash = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
unicode-width = "0.2"
shell-words = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
